# Application
spring.application.name=notification-engine

# H2 Database
spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=notification-engine
spring.kafka.consumer.auto-offset-reset=earliest

# Deserialize Kafka JSON into Java objects
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Allow our NotificationEvent class to be deserialized
spring.kafka.consumer.properties.spring.json.trusted.packages=com.notification.engine.event


spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

#disables SMTP authentication
spring.mail.properties.mail.smtp.auth=false
#disable TLS encryption on mails
spring.mail.properties.mail.smtp.starttls.enable=false


#Actuator configs

management.endpoints.web.exposure.include=health,info,metrics

info.app.name=real-time-notification-engine
info.app.description=Event-driven notification service
info.app.version=1.0.0
